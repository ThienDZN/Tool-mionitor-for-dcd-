[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard-ai-overlay"
version = "0.1.0"
description = "Clipboard-triggered AI overlay desktop utility."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.12.0",
    "pillow>=12.0.0",
    "pypdf>=6.17.0",
    "PySide6>=6.7",
    "openai>=1.0.0",
    "pynput>=1.7.6",
    "python-dotenv>=1.0.0",
    "rapidocr_onnxruntime>=1.4.4",
]

[project.scripts]
clipboard-ai-overlay = "clip_overlay_ai.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
